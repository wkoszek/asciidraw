# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# One tag, every channel:  git tag v0.1.0 && make release
#
# Gitea is home, but the public downloads live in GitHub Releases: Homebrew,
# Scoop, winget, AUR and Nix all fetch from a public URL, and package
# reviewers expect GitHub. `make release` reads a GitHub token from 1Password.
# `make snapshot` builds everything into dist/ and publishes nothing.
version: 2

project_name: asciidraw

before:
  hooks:
    - go mod tidy
    - go test ./...
    - mandoc -Tlint -W warning asciidraw.1
    # Debian and Fedora want man pages gzipped; -n keeps the build reproducible.
    - mkdir -p build
    - sh -c "gzip -9n -c asciidraw.1 > build/asciidraw.1.gz"

builds:
  - id: asciidraw
    binary: asciidraw
    env:
      - CGO_ENABLED=0 # pure Go: every target cross-compiles from one machine
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd, openbsd, netbsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: openbsd, goarch: arm }
      - { goos: netbsd, goarch: arm }
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

# One macOS binary for Apple silicon and Intel, so there is one thing to sign
# and notarize. scripts/macos-sign.sh does both; MACOS_SIGN=0 skips it.
universal_binaries:
  - id: asciidraw
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: ./scripts/macos-sign.sh "{{ .Path }}"
          output: true

archives:
  - id: asciidraw
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - asciidraw.1

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: wkoszek
    name: asciidraw
  draft: false
  prerelease: auto
  name_template: "asciidraw {{ .Tag }}"

# Debian, Ubuntu, Fedora, RHEL, Alpine and Arch packages, attached to the
# release so people can install them by hand.
nfpms:
  - id: packages
    package_name: asciidraw
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Adam Koszek
    homepage: https://github.com/wkoszek/asciidraw
    maintainer: Adam Koszek <adam@koszek.com>
    description: Draw ASCII mockups in the terminal with your mouse.
    license: BSD-2-Clause
    section: utils
    formats: [deb, rpm, apk, archlinux]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/asciidraw/LICENSE
      - src: README.md
        dst: /usr/share/doc/asciidraw/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/asciidraw/CHANGELOG.md
      - src: build/asciidraw.1.gz
        dst: /usr/share/man/man1/asciidraw.1.gz

# brew install wkoszek/tap/asciidraw
homebrew_casks:
  - name: asciidraw
    repository:
      owner: wkoszek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    manpages: [asciidraw.1]
    homepage: https://github.com/wkoszek/asciidraw
    description: Draw ASCII mockups in the terminal with your mouse
    license: BSD-2-Clause
    commit_author:
      name: Adam Koszek
      email: adam@koszek.com

# The channels below publish only when their switch is set, so a release
# works before each one is set up. make release sets them from 1Password.

# scoop bucket add wkoszek https://github.com/wkoszek/scoop-bucket
# scoop install wkoszek/asciidraw
scoops:
  - name: asciidraw
    repository:
      owner: wkoszek
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/wkoszek/asciidraw
    description: Draw ASCII mockups in the terminal with your mouse.
    license: BSD-2-Clause
    commit_author:
      name: Adam Koszek
      email: adam@koszek.com
    skip_upload: '{{ if ne (envOrDefault "PUBLISH_SCOOP" "") "1" }}true{{ end }}'

# winget install wkoszek.asciidraw
# Opens a pull request on microsoft/winget-pkgs from the fork wkoszek/winget-pkgs.
winget:
  - name: asciidraw
    publisher: Adam Koszek
    package_identifier: wkoszek.asciidraw
    publisher_url: https://github.com/wkoszek
    homepage: https://github.com/wkoszek/asciidraw
    short_description: Draw ASCII mockups in the terminal with your mouse.
    license: BSD-2-Clause
    license_url: https://github.com/wkoszek/asciidraw/blob/main/LICENSE
    tags: [ascii, diagrams, mockups, terminal, tui]
    commit_author:
      name: Adam Koszek
      email: adam@koszek.com
    repository:
      owner: wkoszek
      name: winget-pkgs
      branch: "asciidraw-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if ne (envOrDefault "PUBLISH_WINGET" "") "1" }}true{{ end }}'

# yay -S asciidraw-bin
aurs:
  - name: asciidraw-bin
    homepage: https://github.com/wkoszek/asciidraw
    description: Draw ASCII mockups in the terminal with your mouse
    maintainers:
      - Adam Koszek <adam@koszek.com>
    license: BSD-2-Clause
    provides: [asciidraw]
    conflicts: [asciidraw]
    private_key: '{{ if isEnvSet "AUR_KEY" }}{{ .Env.AUR_KEY }}{{ end }}'
    git_url: ssh://aur@aur.archlinux.org/asciidraw-bin.git
    commit_author:
      name: Adam Koszek
      email: adam@koszek.com
    package: |-
      install -Dm755 ./asciidraw "${pkgdir}/usr/bin/asciidraw"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/asciidraw/LICENSE"
      install -Dm644 ./README.md "${pkgdir}/usr/share/doc/asciidraw/README.md"
      install -Dm644 ./asciidraw.1 "${pkgdir}/usr/share/man/man1/asciidraw.1"
    skip_upload: '{{ if not (isEnvSet "AUR_KEY") }}true{{ end }}'
